<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar - Acadêmico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }

    :root {  
      --blue-600: #2f5fe0;  
      --blue-700: #2347b8;  
      --blue-50: #eef2ff;  
      --navy-950: #0a1224;  
      --navy-800: #13203a;  
      --ink: #171c26;  
      --slate-500: #6b7383;  
      --slate-300: #c4cad6;  
      --slate-200: #e4e7ee;  
      --surface: #fbfcfe;  
      --white: #ffffff;
      --radius-md: 8px;
      --radius-lg: 12px;
      --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    html, body { 
      height: 100%; 
    }

    body {  
      font-family: 'Inter', sans-serif;  
      color: var(--ink);  
      background-color: var(--surface);
      -webkit-font-smoothing: antialiased;
    }

    .login-page {  
      display: flex;  
      min-height: 100vh;
      width: 100%;
    }

    /* ===== PAINEL ESQUERDO ===== */
    .left-panel {  
      position: relative;  
      flex: 0 0 46%;  
      display: flex;  
      flex-direction: column;  
      justify-content: space-between;  
      padding: 4rem 3.5rem;  
      overflow: hidden;  
      background:

      background-size: cover;
      background-position: center;
      color: var(--white);
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      background: var(--blue-600);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.25rem;
      box-shadow: 0 4px 12px rgba(47, 95, 224, 0.4);
    }

    .brand-name {
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
    }

    .hero-content {
      max-width: 440px;
    }

    .hero-title {
      font-size: 2.5rem;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.03em;
      margin-bottom: 1.25rem;
    }

    .hero-title span {
      color: #6085ef;
    }

    .hero-description {
      font-size: 1.05rem;
      line-height: 1.6;
      color: var(--slate-300);
      font-weight: 400;
    }

    .brand-footer {
      font-size: 0.875rem;
      color: var(--slate-500);
    }

    /* ===== PAINEL DIREITO ===== */
    .right-panel {  
      flex: 1;  
      display: flex;  
      flex-direction: column;  
      justify-content: center;  
      align-items: center;  
      padding: 3rem 2rem;  
      background-color: var(--surface);
    }

    .form-wrapper {
      width: 100%;
      max-width: 400px;
    }

    .form-header {
      margin-bottom: 2.25rem;
    }

    .form-title {
      font-size: 1.875rem;
      font-weight: 700;
      color: var(--navy-950);
      letter-spacing: -0.025em;
      margin-bottom: 0.5rem;
    }

    .form-subtitle {
      font-size: 0.95rem;
      color: var(--slate-500);
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .input-group label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--navy-800);
    }

    .input-field {
      width: 100%;
      padding: 0.875rem 1rem;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--ink);
      background-color: var(--white);
      border: 1px solid var(--slate-300);
      border-radius: var(--radius-md);
      outline: none;
      transition: var(--transition);
    }

    .input-field::placeholder {
      color: var(--slate-500);
      opacity: 0.7;
    }

    .input-field:focus {
      border-color: var(--blue-600);
      box-shadow: 0 0 0 4px var(--blue-50);
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.25rem;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      user-select: none;
    }

    .remember-me input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--blue-600);
      cursor: pointer;
    }

    .remember-me span {
      font-size: 0.875rem;
      color: var(--slate-500);
      font-weight: 500;
    }

    .forgot-link {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--blue-600);
      text-decoration: none;
      transition: var(--transition);
    }

    .forgot-link:hover {
      color: var(--blue-700);
      text-decoration: underline;
    }

    .submit-btn {
      width: 100%;
      padding: 0.875rem;
      margin-top: 0.5rem;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--white);
      background-color: var(--blue-600);
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 2px 6px rgba(47, 95, 224, 0.25);
    }

    .submit-btn:hover {
      background-color: var(--blue-700);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(47, 95, 224, 0.35);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    /* ===== RESPONSIVIDADE ===== */
    @media (max-width: 900px) {
      .left-panel {
        display: none;
      }
      .right-panel {
        padding: 2rem 1.5rem;
      }
    }
  </style>
</head>
<body>

  <div class="login-page">
    <!-- PAINEL ESQUERDO: BRANDING & APRESENTAÇÃO -->
    <aside class="left-panel">
      <div class="brand-header">
        <div class="brand-icon">A</div>
        <span class="brand-name">Acadêmico</span>
      </div>

      <div class="hero-content">
        <h1 class="hero-title">Sua jornada acadêmica em <span>um só lugar</span>.</h1>
        <p class="hero-description">
          Acesse notas, materiais de aula e acompanhe o seu progresso educacional com uma experiência moderna e intuitiva.
        </p>
      </div>

      <div class="brand-footer">
        &copy; 2026 Portal Acadêmico. Todos os direitos reservados.
      </div>
    </aside>

    <!-- PAINEL DIREITO: FORMULÁRIO DE AUTENTICAÇÃO -->
    <main class="right-panel">
      <div class="form-wrapper">
        <header class="form-header">
          <h2 class="form-title">Acesse sua conta</h2>
          <p class="form-subtitle">Informe suas credenciais para continuar</p>
        </header>

        <form class="login-form" action="#" method="POST">
          <div class="input-group">
            <label for="email">E-mail ou Matrícula</label>
            <input 
              type="text" 
              id="email" 
              name="email" 
              class="input-field" 
              placeholder="exemplo@instituicao.edu.br" 
              required
              autocomplete="username"
            >
          </div>

          <div class="input-group">
            <label for="password">Senha</label>
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="input-field" 
              placeholder="••••••••" 
              required
              autocomplete="current-password"
            >
          </div>

          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox" name="remember">
              <span>Lembrar-me</span>
            </label>
            <a href="#" class="forgot-link">Esqueceu a senha?</a>
          </div>

          <button type="submit" class="submit-btn">Entrar na plataforma</button>
        </form>
      </div>
    </main>
  </div>

</body>
</html>

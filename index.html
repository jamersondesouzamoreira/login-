<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SECURE ACCESS - Login</title>
  
  <!-- Ícones para os inputs e redes sociais -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #070913;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .container {
      display: flex;
      width: 100vw;
      height: 100vh;
      background: #0b0e17;
    }

    /* LADO ESQUERDO: IMAGEM */
    .left-side {
      flex: 1.2;
      background: url('https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?q=80&w=1000&auto=format&fit=crop') center/cover no-repeat;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 2px solid #00d2ff;
      box-shadow: 5px 0 25px rgba(0, 210, 255, 0.3);
    }

    /* LADO DIREITO: FORMULÁRIO */
    .right-side {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #090c15;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(0, 210, 255, 0.05) 0%, transparent 60%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      padding: 40px;
      background: rgba(13, 17, 28, 0.85);
      border: 1px solid rgba(0, 210, 255, 0.3);
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.15), inset 0 0 15px rgba(0, 212, 255, 0.05);
      text-align: center;
      position: relative;
    }

    .login-box h1 {
      color: #e0f7fc;
      font-size: 24px;
      letter-spacing: 2px;
      margin-bottom: 5px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .login-box p.subtitle {
      color: #6b7c96;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .input-group {
      text-align: left;
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      color: #8a99ad;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .input-field {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-field i {
      position: absolute;
      left: 15px;
      color: #00d2ff;
      font-size: 14px;
    }

    .input-field input {
      width: 100%;
      padding: 12px 15px 12px 42px;
      background: #0d121d;
      border: 1px solid #00d2ff;
      border-radius: 8px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      box-shadow: 0 0 8px rgba(0, 210, 255, 0.2);
      transition: all 0.3s ease;
    }

    .input-field input:focus {
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
      border-color: #00f0ff;
    }

    .forgot-pass {
      display: flex;
      justify-content: flex-end;
      margin-top: 5px;
    }

    .forgot-pass a {
      color: #00d2ff;
      font-size: 12px;
      text-decoration: none;
    }

    .forgot-pass a:hover {
      text-decoration: underline;
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      margin-top: 25px;
      background: transparent;
      border: 1px solid #00d2ff;
      border-radius: 8px;
      color: #00d2ff;
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(0, 210, 255, 0.3);
      transition: all 0.3s ease;
      text-transform: uppercase;
    }

    .btn-login:hover {
      background: #00d2ff;
      color: #000;
      box-shadow: 0 0 25px rgba(0, 210, 255, 0.8);
    }

    .divider {
      color: #5c6b80;
      font-size: 12px;
      margin: 25px 0 15px 0;
    }

    .social-login {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .social-btn {
      width: 42px;
      height: 42px;
      background: #121824;
      border: 1px solid #252f40;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .social-btn:hover {
      border-color: #00d2ff;
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
    }

    .signup-text {
      color: #6b7c96;
      font-size: 13px;
    }

    .signup-text a {
      color: #00d2ff;
      text-decoration: none;
      font-weight: bold;
    }

    /* Estrela decorativa no canto */
    .star-icon {
      position: absolute;
      bottom: 15px;
      right: 15px;
      color: #3b485d;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Lado Esquerdo (Imagem Estilo Cyberpunk) -->
    <div class="left-side"></div>

    <!-- Lado Direito (Formulário) -->
    <div class="right-side">
      <div class="login-box">
        <h1>SECURE ACCESS</h1>
        <p class="subtitle">Log in to your account</p>

        <form>
          <div class="input-group">
            <label for="email">Email Address</label>
            <div class="input-field">
              <i class="fa-regular fa-envelope"></i>
              <input type="email" id="email" value="user@futureemail.com" required>
            </div>
          </div>

          <div class="input-group">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <label for="password">Password</label>
              <div class="forgot-pass">
                <a href="#">Forgot?</a>
              </div>
            </div>
            <div class="input-field">
              <i class="fa-solid fa-lock"></i>
              <input type="password" id="password" value="12345678" required>
            </div>
          </div>

          <button type="submit" class="btn-login">LOG IN</button>
        </form>

        <div class="divider">Or connect with:</div>

        <div class="social-login">
          <div class="social-btn"><i class="fa-brands fa-google"></i></div>
          <div class="social-btn"><i class="fa-brands fa-github"></i></div>
          <div class="social-btn"><i class="fa-brands fa-apple"></i></div>
        </div>

        <div class="signup-text">
          Don't have an account? <a href="#">Sign Up</a>
        </div>

        <div class="star-icon"><i class="fa-solid fa-sparkles"></i></div>
      </div>
    </div>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Acadêmico - Login</title>
  <!-- Ícones do FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Arquivo de Estilo CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page-wrapper">
    
    <!-- LADO ESQUERDO: Imagem com Overlay e Texto -->
    <div class="left-banner">
      <div class="banner-overlay"></div>
      
      <!-- Marca/Logo no topo superior esquerdo -->
      <div class="top-brand">
        <i class="fa-solid fa-graduation-cap"></i>
        <span>Acadêmico</span>
      </div>

      <!-- Informações no canto inferior esquerdo (sobre a imagem) -->
      <div class="bottom-content">
        <p class="tagline">SISTEMA ACADÊMICO</p>
        <h1 class="main-title">Tecnologia e informação em um único ambiente.</h1>
        <p class="description">
          Acesse sua conta para acompanhar conteúdos, atividades e informações da plataforma.
        </p>
      </div>
    </div>

    <!-- LADO DIREITO: Painel de Login -->
    <div class="right-panel">
      
      <!-- Card Centralizado de Login -->
      <div class="login-card">
        <div class="card-header">
          <h2>Bem-vindo novamente</h2>
          <p>Informe seus dados para acessar o sistema.</p>
        </div>

        <form class="login-form">
          <!-- Campo E-mail -->
          <div class="form-group">
            <label for="email">E-mail</label>
            <div class="input-wrapper">
              <i class="fa-regular fa-envelope input-icon"></i>
              <input type="email" id="email" placeholder="Digite seu e-mail" required>
            </div>
          </div>

          <!-- Campo Senha -->
          <div class="form-group">
            <label for="password">Senha</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-lock input-icon"></i>
              <input type="password" id="password" placeholder="Digite sua senha" required>
              <i class="fa-regular fa-eye toggle-password" id="togglePassword"></i>
            </div>
          </div>

          <!-- Opções: Lembrar de mim & Esqueci minha senha -->
          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox">
              <span>Lembrar de mim</span>
            </label>
            <a href="#" class="forgot-password">Esqueci minha senha</a>
          </div>

          <!-- Botão Entrar -->
          <button type="submit" class="btn-submit">Entrar</button>
        </form>

        <!-- Footer do Card -->
        <div class="card-footer">
          Ainda não possui uma conta? <a href="#">Criar conta</a>
        </div>
      </div>

    </div>

  </div>

  <!-- Script básico para alternar visibilidade da senha -->
  <script>
    const togglePassword = document.querySelector('#togglePassword');
    const password = document.querySelector('#password');

    togglePassword.addEventListener('click', function () {
      const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
      password.setAttribute('type', type);
      this.classList.toggle('fa-eye');
      this.classList.toggle('fa-eye-slash');
    });
  </script>
</body>
</html>

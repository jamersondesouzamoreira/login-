<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar - Acadêmico Tech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }

    :root {  
      /* Paleta High-Tech & Cyber Neon */
      --tech-bg: #030712;
      --tech-panel: rgba(15, 23, 42, 0.85);
      --cyan-neon: #00f0ff;
      --purple-neon: #8b5cf6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      
      --glow-cyan: rgba(0, 240, 255, 0.4);
      --glow-purple: rgba(139, 92, 246, 0.4);

      --radius-md: 10px;
      --radius-lg: 20px;
      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    html, body { 
      height: 100%; 
    }

    body {  
      font-family: 'Inter', sans-serif;  
      color: var(--text-main);  
      background-color: var(--tech-bg);
      -webkit-font-smoothing: antialiased;
    }

    .login-page {  
      display: flex;  
      min-height: 100vh;
      width: 100%;
    }

    /* ===== PAINEL ESQUERDO COM IMAGEM DE FUNDO E TEXTOS LEGÍVEIS ===== */
    .left-panel {  
      position: relative;  
      flex: 0 0 46%;  
      display: flex;  
      flex-direction: column;  
      justify-content: space-between;  
      padding: 4rem 3.5rem;  
      overflow: hidden;  
      
      /* Substitua 'imagem-fundo.jpg' pelo nome correto do arquivo de imagem na sua pasta */
      background-image: 
        linear-gradient(135deg, rgba(3, 7, 18, 0.85) 0%, rgba(15, 23, 42, 0.70) 50%, rgba(139, 92, 246, 0.35) 100%),
        url('imagem-fundo.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #ffffff;
    }

    .left-panel-card {
      background: rgba(3, 7, 18, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    .left-panel-card::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 10%;
      width: 80%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan-neon), transparent);
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 0.875rem;
      margin-bottom: 2rem;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--purple-neon), var(--cyan-neon));
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.35rem;
      color: #ffffff;
      box-shadow: 0 0 15px var(--glow-cyan);
    }

    .brand-name {
      font-weight: 700;
      font-size: 1.35rem;
      letter-spacing: -0.02em;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
    }

    .hero-title {
      font-size: 2.25rem;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.03em;
      margin-bottom: 1rem;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
    }

    .hero-title span {
      background: linear-gradient(90deg, var(--cyan-neon), #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 10px var(--glow-cyan));
    }

    .hero-description {
      font-size: 1rem;
      line-height: 1.6;
      color: #e2e8f0;
      font-weight: 400;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
    }

    .brand-footer {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.7);
      font-family: 'JetBrains Mono', monospace;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
    }

    /* ===== PAINEL DIREITO: FORMULÁRIO CYBER ===== */
    .right-panel {  
      flex: 1;  
      display: flex;  
      flex-direction: column;  
      justify-content: center;  
      align-items: center;  
      padding: 3rem 2rem;  
      background-color: var(--tech-bg);
      background-image: 
        radial-gradient(circle at 85% 15%, rgba(0, 240, 255, 0.1) 0%, transparent 40%),
        radial-gradient(circle at 15% 85%, rgba(139, 92, 246, 0.1) 0%, transparent 40%);
    }

    .form-wrapper {
      width: 100%;
      max-width: 420px;
      background: var(--tech-panel);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 2.5rem;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    .form-wrapper::after {
      content: '';
      position: absolute;
      bottom: -1px;
      right: 10%;
      width: 40%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--purple-neon), transparent);
    }

    .form-header {
      margin-bottom: 2rem;
    }

    .badge-tech {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--cyan-neon);
      background: rgba(0, 240, 255, 0.1);
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      border: 1px solid rgba(0, 240, 255, 0.25);
      margin-bottom: 0.75rem;
    }

    .form-title {
      font-size: 1.75rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.025em;
      margin-bottom: 0.375rem;
    }

    .form-subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .input-group label {
      font-size: 0.825rem;
      font-weight: 600;
      color: #cbd5e1;
      letter-spacing: 0.02em;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 1rem;
      width: 20px;
      height: 20px;
      color: var(--text-muted);
      pointer-events: none;
      transition: var(--transition);
    }

    .input-field {
      width: 100%;
      padding: 0.875rem 1rem 0.875rem 2.85rem;
      font-family: inherit;
      font-size: 0.95rem;
      color: #ffffff;
      background-color: rgba(3, 7, 18, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-md);
      outline: none;
      transition: var(--transition);
    }

    .input-field::placeholder {
      color: #475569;
    }

    .input-field:focus {
      background-color: rgba(3, 7, 18, 0.95);
      border-color: var(--cyan-neon);
      box-shadow: 0 0 15px var(--glow-cyan);
    }

    .input-field:focus + .input-icon,
    .input-wrapper:focus-within .input-icon {
      color: var(--cyan-neon);
      filter: drop-shadow(0 0 5px var(--cyan-neon));
    }

    .toggle-password {
      position: absolute;
      right: 0.875rem;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      transition: var(--transition);
    }

    .toggle-password:hover {
      color: var(--cyan-neon);
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.25rem;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      user-select: none;
    }

    .remember-me input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--cyan-neon);
      border-radius: 4px;
      cursor: pointer;
    }

    .remember-me span {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .forgot-link {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--cyan-neon);
      text-decoration: none;
      transition: var(--transition);
    }

    .forgot-link:hover {
      color: #ffffff;
      text-shadow: 0 0 8px var(--glow-cyan);
    }

    .submit-btn {
      width: 100%;
      padding: 0.875rem;
      margin-top: 0.5rem;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      color: #030712;
      background: linear-gradient(90deg, var(--cyan-neon), #38bdf8);
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 0 20px var(--glow-cyan);
      letter-spacing: 0.02em;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.7);
      background: linear-gradient(90deg, #38bdf8, var(--cyan-neon));
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    @media (max-width: 900px) {
      .left-panel {
        display: none;
      }
      .right-panel {
        padding: 1.5rem;
      }
      .form-wrapper {
        border: none;
        box-shadow: none;
        padding: 1rem;
        background: transparent;
      }
    }
  </style>
</head>
<body>

  <div class="login-page">
    <aside class="left-panel">
      <div class="left-panel-card">
        <div class="brand-header">
          <div class="brand-icon">A</div>
          <span class="brand-name">Acadêmico</span>
        </div>

        <div class="hero-content">
          <h1 class="hero-title">Sua jornada acadêmica em <span>um só lugar</span>.</h1>
          <p class="hero-description">
            Acesse notas, materiais de aula e acompanhe seu progresso educacional com segurança e inteligência.
          </p>
        </div>
      </div>

      <div class="brand-footer">
        SYS.VER // 2.0.26
      </div>
    </aside>

    <main class="right-panel">
      <div class="form-wrapper">
        <header class="form-header">
          <span class="badge-tech">Acesso Restrito</span>
          <h2 class="form-title">Autenticação</h2>
          <p class="form-subtitle">Digite suas credenciais de acesso</p>
        </header>

        <form class="login-form" action="#" method="POST">
          <div class="input-group">
            <label for="email">E-mail ou Matrícula</label>
            <div class="input-wrapper">
              <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
              </svg>
              <input 
                type="text" 
                id="email" 
                name="email" 
                class="input-field" 
                placeholder="usuario@instituicao.edu.br" 
                required
                autocomplete="username"
              >
            </div>
          </div>

          <div class="input-group">
            <label for="password">Senha de Acesso</label>
            <div class="input-wrapper">
              <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
              <input 
                type="password" 
                id="password" 
                name="password" 
                class="input-field" 
                placeholder="••••••••" 
                required
                autocomplete="current-password"
              >
              <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar senha">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
              </button>
            </div>
          </div>

          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox" name="remember">
              <span>Lembrar-me</span>
            </label>
            <a href="#" class="forgot-link">Esqueceu a senha?</a>
          </div>

          <button type="submit" class="submit-btn">Acessar Sistema</button>
        </form>
      </div>
    </main>
  </div>

  <script>
    const togglePasswordBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');

    togglePasswordBtn.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar - Acadêmico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }

    :root {  
      --blue-600: #2f5fe0;  
      --blue-700: #1d4ed8;  
      --blue-50: #eff6ff;  
      --navy-950: #0a1224;  
      --navy-800: #1e293b;  
      --ink: #0f172a;  
      --slate-500: #64748b;  
      --slate-300: #cbd5e1;  
      --slate-200: #e2e8f0;  
      --surface: #f8fafc;  
      --white: #ffffff;
      --radius-md: 10px;
      --radius-lg: 16px;
      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    html, body { 
      height: 100%; 
    }

    body {  
      font-family: 'Inter', sans-serif;  
      color: var(--ink);  
      background-color: var(--surface);
      -webkit-font-smoothing: antialiased;
    }

    .login-page {  
      display: flex;  
      min-height: 100vh;
      width: 100%;
    }

    /* ===== PAINEL ESQUERDO COM A IMAGEM ===== */
    .left-panel {  
      position: relative;  
      flex: 0 0 46%;  
      display: flex;  
      flex-direction: column;  
      justify-content: space-between;  
      padding: 4rem 3.5rem;  
      overflow: hidden;  
      
      /* Imagem de Fundo com Degradê Escuro Integrado */
      background: 
        linear-gradient(135deg, rgba(10, 18, 36, 0.85) 0%, rgba(15, 23, 42, 0.65) 100%),
        url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAn4AAAHgCAIAAAC0NveZAAAQAElEQVR4AcT997dty3XfiVXNCmutHU648T0AL+EhEjmDAQApSpRIkGAQJSqwpXYPu0l1220lq6WWh2yN9nBbw5JIKnc7/Bkewx79gxx+aNEy3RJtiREkAkHgPbx30wl7r1XBn6o6Z919zzn34l4IlIvfM/e3Zs2aNSuvtffFo/wf/9l/83/4p/81+N//k3/2v/vH//S/+Uf/BPzX//AfIwEE/LN/8I/+6S/9w3/yi//gH//SP/iHv/SPfumX/iH4xV/8B7/wC7/09//+L/69v/+Lf/fv/cL/5u/+vb/z9/7+/f3f/9l/83/4p/81+N//k3/2v/vH//S/+Uf/BPzX//AfIwEE/LN/8I/+6S/9w3/yi//gH//SP/iHv/SPfumX/iH4xV/8B7/wC7/09//+L/69v/+Lf/fv/cL/5u/+vb/z9/7+/f3f/9l/83/4p/81+N//k3/2v/vH//S/+Uf/BPzX//AfIwEE/LN/8I/+6S/9w3/yi//gH//SP/iHv/SPfumX/iH4xV/8B7/wC7/09//+L/69v/+Lf/fv/cL/5u/+vb/z9/7+/f3f/9l/83/4p/81+N//k3/2v/vH//S/+Uf/BPzX//AfIwEE/LN/8I/+6S/9w3/yi//gH//SP/iHv/SPfumX/iH4xV/8B7/wC7/09//+L/69v/+Lf/fv/cL/5u/+vb/z9/7+/f3f/9l/83/4p/81+N//k3/2v/vH//S/+Uf/BPzX//AfIwEE/LN/8I/+6S/9w3/yi//gH//SP/iHv/SPfumX/iH4xV/8B7/wC7/09//+L/69v/+Lf/fv/cL/5u/+vb/z9/7+/f3f/9l/83/4p/81+N//k3/2v/vH//S/+Uf/BPzX//AfIwEE/LN/8I/+6S/9w3/yi//gH//SP/iHv/SPfumX/iH4xV/8B7/wC7/09//+L/69v/+Lf/fv/cL/5u/+vb/z9/7+/f3f/9l/83/4p/81+N//k3/2v/vH//S/+Uf/BPzX//AfIwEE/LN/8I/+6S/9w3/yi//gH//SP/iHv/SPfumX/iH4xV/8B7/wC7/09//+L/69v/+Lf/fv/cL/5u/+vb/z9/7+/f3f/9l/83/4p/81+N//k3/2v/vH//S/+Uf/BPzX//AfIwEE/LN/8I/+6S/9w3/yi//gH//SP/iHv/SPfumX/iH4xV/8B7/wC7/09//+L/69v/+Lf/fv/cL/5u/+vb/z9/7+/f3f/9l/83/4p/81+N//k3/2v/vH//S/+Uf/BPzX//AfIwEE/LN/8I/+6S/9w3/yi//gH//SP/iHv/SPfumX/iH4xV/8B7/wC7/09//+L/69v/+Lf/fv/cL/5u/+vb/z9/7+/f3f/9l/83/4p/81+N//k3/2v/vH//S/+Uf/BPzX//AfIwEE/LN/8I/+6S/9w3/yi//gH//SP/iHv/SPfumX/iH4xV/8B7/wC7/09//+L/69v/+Lf/fv/cL/5u/+vb/z9/7+/f3f/9l/83/4p/81+N//k3/2v/vH//S/+Uf/BPzX//AfIwEE/LN/8I/+6S/9w3/yi//gH//SP/iHv/SPfumX/iH4xV/8B7/wC7/09//+L/69v/+Lf/fv/cL/5u/+vb/z9/7+/f3f/9l/83/4p/81+N//k3/2v/vH//S/+Uf/BPzX//AfIwEE/LN/8I/+6S/9w3/yi//gH//SP/iHv/SPfumX/iH4xV/8B7/wC7/09//+L/69v/+Lf/fv/cL/5u/+vb/z9/7+/f3f/9l/83/4p/81+N//k3/2v/vH//S/+Uf/BPzX//AfIwEE/LN/8I/+6S/9w3/yi//gH//SP/iHv/SPfumX/iH4xV/8B7/wC7/09//+L/69v/+Lf/fv/cL/5u/+vb/z9/7+/f3f/9l/83/4p/81+N//k3/2v/vH//S/+Uf/BPzX//AfIwEE/LN/8I/+6S/9w3/yi//gH//SP/iHv/SPfumX/iH4xV/8B7/wC7/09//+L/69v/+Lf/fv/cL/5u/+vb/z9/7+/f3f/9l/83/4p/81+N//k3/2v/vH//S/+Uf/BPzX//AfIwEE/LN/8I/+6S/9w3/yi//gH//SP/iHv/SPfumX/iH4xV/8B7/wC7/09//+L/69v/+Lf/fv/cL/5u/+vb/z9/7+/f3f/9l/83/4p/81+N//k3/2v/vH//S/+Uf/BPzX//AfIwEE/LN/8I/+6S/9w3/yi//gH//SP/iHv/SPfumX/iH4xV/8B7/wC7/09//+L/69v/+Lf/fv/cL/5u/+vb/z9/7+/f3f/9l/83/4p/81+N//k3/2v/vH//S/+Uf/BPzX//AfIwEE/LN/8I/+6S/9w3/yi//gH//SP/iHv/SPfumX/iH4xV/8B7/wC7/09//+L/69v/+Lf/fv/cL/5u/+vb/z9/7+v393/9l/83/4p/81+N//k3/2v/vH//S/+Uf/BPzX//AfIwEE/LN/8I/+6S/9w3/yi//gH//SP/iHv/SPfumX/iH4xV/8B7/wC7/09//+L/69v/+Lf/fv/cL/5u/+vb/z9/7+/f3f/9l/83/4p/81+N//k3/2v/vH//S/+Uf/BPzX//AfIwEE/LN/8I/+6S/9w3/yi//gH//SP/iHv/SPfumX/iH4xV/8B7/wC7/09//+L/69v/+Lf/fv/cL/5u/+vb/z9/7+/33d393d3d3d3d3d3f23/wX43485S96sbgAAAABJRU55ACtk43');
      background-size: cover;
      background-position: center;
      color: var(--white);
    }

    /* Cartão Flutuante Translúcido sobre a Imagem */
    .left-panel-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 0.875rem;
      margin-bottom: 2rem;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--blue-600), #6085ef);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.35rem;
      box-shadow: 0 8px 16px rgba(47, 95, 224, 0.35);
    }

    .brand-name {
      font-weight: 700;
      font-size: 1.35rem;
      letter-spacing: -0.02em;
    }

    .hero-title {
      font-size: 2.25rem;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.03em;
      margin-bottom: 1rem;
    }

    .hero-title span {
      background: linear-gradient(90deg, #93c5fd, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-description {
      font-size: 1rem;
      line-height: 1.6;
      color: var(--slate-300);
      font-weight: 400;
    }

    .brand-footer {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.5);
    }

    /* ===== PAINEL DIREITO: FORMULÁRIO DE LOGIN ===== */
    .right-panel {  
      flex: 1;  
      display: flex;  
      flex-direction: column;  
      justify-content: center;  
      align-items: center;  
      padding: 3rem 2rem;  
      background-color: var(--surface);
    }

    .form-wrapper {
      width: 100%;
      max-width: 420px;
      background: var(--white);
      padding: 2.5rem;
      border-radius: var(--radius-lg);
      border: 1px solid var(--slate-200);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    }

    .form-header {
      margin-bottom: 2rem;
    }

    .form-title {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--navy-950);
      letter-spacing: -0.025em;
      margin-bottom: 0.375rem;
    }

    .form-subtitle {
      font-size: 0.9rem;
      color: var(--slate-500);
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .input-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--navy-800);
    }

    /* Campo de Entrada com Ícones e Efeitos CSS3 */
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 1rem;
      width: 20px;
      height: 20px;
      color: var(--slate-500);
      pointer-events: none;
      transition: var(--transition);
    }

    .input-field {
      width: 100%;
      padding: 0.875rem 1rem 0.875rem 2.85rem;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--ink);
      background-color: var(--surface);
      border: 1.5px solid var(--slate-200);
      border-radius: var(--radius-md);
      outline: none;
      transition: var(--transition);
    }

    .input-field::placeholder {
      color: var(--slate-500);
      opacity: 0.6;
    }

    /* Animação e Foco no Input */
    .input-field:focus {
      background-color: var(--white);
      border-color: var(--blue-600);
      box-shadow: 0 0 0 4px var(--blue-50);
    }

    .input-field:focus + .input-icon,
    .input-wrapper:focus-within .input-icon {
      color: var(--blue-600);
    }

    /* Botão de Mostrar/Ocultar Senha */
    .toggle-password {
      position: absolute;
      right: 0.875rem;
      background: none;
      border: none;
      color: var(--slate-500);
      cursor: pointer;
      padding: 0.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      transition: var(--transition);
    }

    .toggle-password:hover {
      color: var(--ink);
      background: var(--slate-200);
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.25rem;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      user-select: none;
    }

    .remember-me input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--blue-600);
      border-radius: 4px;
      cursor: pointer;
    }

    .remember-me span {
      font-size: 0.85rem;
      color: var(--slate-500);
      font-weight: 500;
    }

    .forgot-link {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--blue-600);
      text-decoration: none;
      transition: var(--transition);
    }

    .forgot-link:hover {
      color: var(--blue-700);
      text-decoration: underline;
    }

    /* Botão de Envio Estilizado */
    .submit-btn {
      width: 100%;
      padding: 0.875rem;
      margin-top: 0.5rem;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--white);
      background: linear-gradient(135deg, var(--blue-600), var(--blue-700));
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 4px 12px rgba(47, 95, 224, 0.25);
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(47, 95, 224, 0.35);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    /* ===== RESPONSIVIDADE ===== */
    @media (max-width: 900px) {
      .left-panel {
        display: none;
      }
      .right-panel {
        padding: 1.5rem;
      }
      .form-wrapper {
        border: none;
        box-shadow: none;
        padding: 1rem;
        background: transparent;
      }
    }
  </style>
</head>
<body>

  <div class="login-page">
    <!-- PAINEL ESQUERDO: BRANDING & IMAGEM DE FUNDO -->
    <aside class="left-panel">
      <div class="left-panel-card">
        <div class="brand-header">
          <div class="brand-icon">A</div>
          <span class="brand-name">Acadêmico</span>
        </div>

        <div class="hero-content">
          <h1 class="hero-title">Sua jornada acadêmica em <span>um só lugar</span>.</h1>
          <p class="hero-description">
            Acesse notas, materiais de aula e acompanhe seu progresso educacional com segurança e facilidade.
          </p>
        </div>
      </div>

      <div class="brand-footer">
        &copy; Portal Acadêmico. Todos os direitos reservados.
      </div>
    </aside>

    <!-- PAINEL DIREITO: FORMULÁRIO DE AUTENTICAÇÃO -->
    <main class="right-panel">
      <div class="form-wrapper">
        <header class="form-header">
          <h2 class="form-title">Acesse sua conta</h2>
          <p class="form-subtitle">Informe suas credenciais para continuar</p>
        </header>

        <form class="login-form" action="#" method="POST">
          <!-- Campo de E-mail/Matrícula -->
          <div class="input-group">
            <label for="email">E-mail ou Matrícula</label>
            <div class="input-wrapper">
              <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
              </svg>
              <input 
                type="text" 
                id="email" 
                name="email" 
                class="input-field" 
                placeholder="exemplo@instituicao.edu.br" 
                required
                autocomplete="username"
              >
            </div>
          </div>

          <!-- Campo de Senha -->
          <div class="input-group">
            <label for="password">Senha</label>
            <div class="input-wrapper">
              <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
              <input 
                type="password" 
                id="password" 
                name="password" 
                class="input-field" 
                placeholder="••••••••" 
                required
                autocomplete="current-password"
              >
              <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar senha">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
              </button>
            </div>
          </div>

          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox" name="remember">
              <span>Lembrar-me</span>
            </label>
            <a href="#" class="forgot-link">Esqueceu a senha?</a>
          </div>

          <button type="submit" class="submit-btn">Entrar na plataforma</button>
        </form>
      </div>
    </main>
  </div>

  <script>
    // Alternar visibilidade da senha
    const togglePasswordBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');

    togglePasswordBtn.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
    });
  </script>
</body>
</html>
